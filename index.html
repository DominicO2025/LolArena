<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Arena Win Tracker</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="page">

  <h1>Arena Win Tracker</h1>

  <!-- Search Form -->
  <div class="search-form">
    <div class="field">
      <label for="inp-name">Summoner Name</label>
      <input type="text" id="inp-name" placeholder="Faker" autocomplete="off">
    </div>
    <div class="field">
      <label for="inp-tag">Tag</label>
      <input type="text" id="inp-tag" placeholder="KR1" maxlength="8" autocomplete="off">
    </div>
    <div class="field">
      <label for="inp-region">Region</label>
      <select id="inp-region">
        <option value="na1">NA</option>
        <option value="euw1">EUW</option>
        <option value="eune1">EUNE</option>
        <option value="kr">KR</option>
        <option value="jp1">JP</option>
        <option value="br1">BR</option>
        <option value="la1">LAN</option>
        <option value="la2">LAS</option>
        <option value="oc1">OCE</option>
        <option value="tr1">TR</option>
      </select>
    </div>
    <button id="btn-search" onclick="search()">Search</button>
  </div>

  <p id="status-text"></p>

  <!-- Player Info (hidden until search) -->
  <div id="player-banner" style="display:none">
    <h2 id="player-name"></h2>
    <p>Region: <span id="player-region"></span></p>
    <p>Champions played in Arena: <span id="stat-champs"></span></p>
    <p>Matches scanned: <span id="stat-matches"></span></p>
  </div>

  <!-- Champion Grid -->
  <h2>All Champions A-Z</h2>
  <div id="champion-grid"></div>

</div><!-- /.page -->

<script>
  const CHAMPIONS = [
    {name:"Aatrox",id:"Aatrox"},{name:"Ahri",id:"Ahri"},{name:"Akali",id:"Akali"},
    {name:"Akshan",id:"Akshan"},{name:"Alistar",id:"Alistar"},{name:"Ambessa",id:"Ambessa"},
    {name:"Amumu",id:"Amumu"},{name:"Anivia",id:"Anivia"},{name:"Annie",id:"Annie"},
    {name:"Aphelios",id:"Aphelios"},{name:"Ashe",id:"Ashe"},{name:"Aurelion Sol",id:"AurelionSol"},
    {name:"Aurora",id:"Aurora"},{name:"Azir",id:"Azir"},{name:"Bard",id:"Bard"},
    {name:"Bel'Veth",id:"Belveth"},{name:"Blitzcrank",id:"Blitzcrank"},{name:"Brand",id:"Brand"},
    {name:"Braum",id:"Braum"},{name:"Briar",id:"Briar"},{name:"Caitlyn",id:"Caitlyn"},
    {name:"Camille",id:"Camille"},{name:"Cassiopeia",id:"Cassiopeia"},{name:"Cho'Gath",id:"Chogath"},
    {name:"Corki",id:"Corki"},{name:"Darius",id:"Darius"},{name:"Diana",id:"Diana"},
    {name:"Dr. Mundo",id:"DrMundo"},{name:"Draven",id:"Draven"},{name:"Ekko",id:"Ekko"},
    {name:"Elise",id:"Elise"},{name:"Evelynn",id:"Evelynn"},{name:"Ezreal",id:"Ezreal"},
    {name:"Fiddlesticks",id:"FiddleSticks"},{name:"Fiora",id:"Fiora"},{name:"Fizz",id:"Fizz"},
    {name:"Galio",id:"Galio"},{name:"Gangplank",id:"Gangplank"},{name:"Garen",id:"Garen"},
    {name:"Gnar",id:"Gnar"},{name:"Gragas",id:"Gragas"},{name:"Graves",id:"Graves"},
    {name:"Gwen",id:"Gwen"},{name:"Hecarim",id:"Hecarim"},{name:"Heimerdinger",id:"Heimerdinger"},
    {name:"Hwei",id:"Hwei"},{name:"Illaoi",id:"Illaoi"},{name:"Irelia",id:"Irelia"},
    {name:"Ivern",id:"Ivern"},{name:"Janna",id:"Janna"},{name:"Jarvan IV",id:"JarvanIV"},
    {name:"Jax",id:"Jax"},{name:"Jayce",id:"Jayce"},{name:"Jhin",id:"Jhin"},
    {name:"Jinx",id:"Jinx"},{name:"K'Sante",id:"KSante"},{name:"Kai'Sa",id:"Kaisa"},
    {name:"Kalista",id:"Kalista"},{name:"Karma",id:"Karma"},{name:"Karthus",id:"Karthus"},
    {name:"Kassadin",id:"Kassadin"},{name:"Katarina",id:"Katarina"},{name:"Kayle",id:"Kayle"},
    {name:"Kayn",id:"Kayn"},{name:"Kennen",id:"Kennen"},{name:"Kha'Zix",id:"Khazix"},
    {name:"Kindred",id:"Kindred"},{name:"Kled",id:"Kled"},{name:"Kog'Maw",id:"KogMaw"},
    {name:"LeBlanc",id:"Leblanc"},{name:"Lee Sin",id:"LeeSin"},{name:"Leona",id:"Leona"},
    {name:"Lillia",id:"Lillia"},{name:"Lissandra",id:"Lissandra"},{name:"Lucian",id:"Lucian"},
    {name:"Lulu",id:"Lulu"},{name:"Lux",id:"Lux"},{name:"Malphite",id:"Malphite"},
    {name:"Malzahar",id:"Malzahar"},{name:"Maokai",id:"Maokai"},{name:"Master Yi",id:"MasterYi"},
    {name:"Mel",id:"Mel"},{name:"Milio",id:"Milio"},{name:"Miss Fortune",id:"MissFortune"},
    {name:"Mordekaiser",id:"Mordekaiser"},{name:"Morgana",id:"Morgana"},{name:"Naafiri",id:"Naafiri"},
    {name:"Nami",id:"Nami"},{name:"Nasus",id:"Nasus"},{name:"Nautilus",id:"Nautilus"},
    {name:"Neeko",id:"Neeko"},{name:"Nidalee",id:"Nidalee"},{name:"Nilah",id:"Nilah"},
    {name:"Nocturne",id:"Nocturne"},{name:"Nunu & Willump",id:"Nunu"},{name:"Olaf",id:"Olaf"},
    {name:"Orianna",id:"Orianna"},{name:"Ornn",id:"Ornn"},{name:"Pantheon",id:"Pantheon"},
    {name:"Poppy",id:"Poppy"},{name:"Pyke",id:"Pyke"},{name:"Qiyana",id:"Qiyana"},
    {name:"Quinn",id:"Quinn"},{name:"Rakan",id:"Rakan"},{name:"Rammus",id:"Rammus"},
    {name:"Rek'Sai",id:"RekSai"},{name:"Rell",id:"Rell"},{name:"Renata Glasc",id:"Renata"},
    {name:"Renekton",id:"Renekton"},{name:"Rengar",id:"Rengar"},{name:"Riven",id:"Riven"},
    {name:"Rumble",id:"Rumble"},{name:"Ryze",id:"Ryze"},{name:"Samira",id:"Samira"},
    {name:"Sejuani",id:"Sejuani"},{name:"Senna",id:"Senna"},{name:"Seraphine",id:"Seraphine"},
    {name:"Sett",id:"Sett"},{name:"Shaco",id:"Shaco"},{name:"Shen",id:"Shen"},
    {name:"Shyvana",id:"Shyvana"},{name:"Singed",id:"Singed"},{name:"Sion",id:"Sion"},
    {name:"Sivir",id:"Sivir"},{name:"Skarner",id:"Skarner"},{name:"Smolder",id:"Smolder"},
    {name:"Sona",id:"Sona"},{name:"Soraka",id:"Soraka"},{name:"Swain",id:"Swain"},
    {name:"Sylas",id:"Sylas"},{name:"Syndra",id:"Syndra"},{name:"Tahm Kench",id:"TahmKench"},
    {name:"Taliyah",id:"Taliyah"},{name:"Talon",id:"Talon"},{name:"Taric",id:"Taric"},
    {name:"Teemo",id:"Teemo"},{name:"Thresh",id:"Thresh"},{name:"Tristana",id:"Tristana"},
    {name:"Trundle",id:"Trundle"},{name:"Tryndamere",id:"Tryndamere"},{name:"Twisted Fate",id:"TwistedFate"},
    {name:"Twitch",id:"Twitch"},{name:"Udyr",id:"Udyr"},{name:"Urgot",id:"Urgot"},
    {name:"Varus",id:"Varus"},{name:"Vayne",id:"Vayne"},{name:"Veigar",id:"Veigar"},
    {name:"Vel'Koz",id:"Velkoz"},{name:"Vex",id:"Vex"},{name:"Vi",id:"Vi"},
    {name:"Viego",id:"Viego"},{name:"Viktor",id:"Viktor"},{name:"Vladimir",id:"Vladimir"},
    {name:"Volibear",id:"Volibear"},{name:"Warwick",id:"Warwick"},{name:"Wukong",id:"MonkeyKing"},
    {name:"Xayah",id:"Xayah"},{name:"Xerath",id:"Xerath"},{name:"Xin Zhao",id:"XinZhao"},
    {name:"Yasuo",id:"Yasuo"},{name:"Yone",id:"Yone"},{name:"Yorick",id:"Yorick"},
    {name:"Yuumi",id:"Yuumi"},{name:"Zac",id:"Zac"},{name:"Zed",id:"Zed"},
    {name:"Zeri",id:"Zeri"},{name:"Ziggs",id:"Ziggs"},{name:"Zilean",id:"Zilean"},
    {name:"Zoe",id:"Zoe"},{name:"Zyra",id:"Zyra"}
  ].sort((a, b) => a.name.localeCompare(b.name));

  const DD_VERSION = '14.24.1';
  const DD_IMG = (id) =>
    `https://ddragon.leagueoflegends.com/cdn/${DD_VERSION}/img/champion/${id}.png`;

  let arenaStats = {};

  function renderGrid() {
    const grid = document.getElementById('champion-grid');
    grid.innerHTML = CHAMPIONS.map(champ => {
      const stats     = arenaStats[champ.id] || arenaStats[champ.name] || null;
      const hasPlayed = stats && stats.gamesPlayed > 0;
      const hasWon    = stats && stats.wins > 0;

      let tooltip = champ.name;
      if (stats) {
        tooltip += ` — ${stats.gamesPlayed} game${stats.gamesPlayed !== 1 ? 's' : ''}`;
        tooltip += `, ${stats.wins} win${stats.wins !== 1 ? 's' : ''}`;
        tooltip += `, ${stats.totalHours.toFixed(1)}h`;
      }

      const losses = stats ? stats.gamesPlayed - stats.wins : 0;

      return `
        <div class="champ-card ${hasWon ? 'won' : hasPlayed ? 'played' : ''}"
             id="card-${champ.id}" title="${tooltip}">
          <img src="${DD_IMG(champ.id)}" alt="${champ.name}" loading="lazy"
               onerror="this.style.display='none'">
          ${hasWon ? '<div class="badge">&#10003;</div>' : ''}
          <div class="champ-name">${champ.name}</div>
          ${stats ? `<div class="champ-stats"><span class="wins">${stats.wins}W</span> <span class="losses">${losses}L</span></div>` : ''}
        </div>
      `;
    }).join('');
  }

  document.querySelectorAll('input').forEach(el => {
    el.addEventListener('keydown', e => { if (e.key === 'Enter') search(); });
  });

  async function search() {
    const name   = document.getElementById('inp-name').value.trim();
    const tag    = document.getElementById('inp-tag').value.trim();
    const region = document.getElementById('inp-region').value;

    if (!name) { setStatus('Please enter a summoner name.'); return; }
    if (!tag)  { setStatus('Please enter a tag e.g. NA1');  return; }

    const btn = document.getElementById('btn-search');
    btn.disabled = true;
    document.getElementById('player-banner').style.display = 'none';
    arenaStats = {};
    renderGrid();

    setStatus('Resolving Riot ID...');
    let puuid;
    try {
      const r = await fetch(`/api/player?name=${encodeURIComponent(name)}&tag=${encodeURIComponent(tag)}&region=${region}`);
      const d = await r.json();
      if (!r.ok || d.error) throw new Error(d.error || `HTTP ${r.status}`);
      puuid = d.puuid;
      document.getElementById('player-name').textContent    = d.gameName + ' #' + d.tagLine;
      document.getElementById('player-region').textContent  = region.toUpperCase();
      document.getElementById('player-banner').style.display = 'block';
    } catch(e) {
      setStatus('Could not find player: ' + e.message);
      btn.disabled = false;
      return;
    }

    setStatus('Fetching Arena match history...');
    try {
      const r = await fetch(`/api/player/arena-stats?puuid=${encodeURIComponent(puuid)}&region=${region}&count=100`);
      const d = await r.json();
      if (!r.ok || d.error) throw new Error(d.error || `HTTP ${r.status}`);

      arenaStats = {};
      for (const c of (d.champions || [])) {
        arenaStats[c.champion] = c;
      }

      document.getElementById('stat-champs').textContent  = d.totalChampions;
      document.getElementById('stat-matches').textContent = d.matchesScanned;

      setStatus('');
      renderGrid();
    } catch(e) {
      setStatus('Failed to load stats: ' + e.message);
      btn.disabled = false;
      return;
    }

    btn.disabled = false;
  }

  function setStatus(msg) {
    document.getElementById('status-text').textContent = msg;
  }

  renderGrid();
</script>
</body>
</html>
